        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/payments/{payment}/reconcile:
    post:
      operationId: reconcileAdminPayment
      tags: [Payments]
      summary: Reconcile a PayHere payment
      description: |
        Admin-only server-side retrieval and reconciliation. The payment must belong to
        PayHere. Candidate transaction identity, order reference, amount and currency are
        matched; ambiguous/no-match/unsupported/refund states do not mutate payment state.
        A matching received transaction can confirm an accepted booking; a matching
        chargeback can mark an already-paid payment chargedback. Repeated reconciliation is
        safe and does not duplicate confirmation notifications.
      security:
        - sanctumBearer: []
      parameters:
        - name: payment
          in: path
          required: true
          description: Payment model identifier.
          schema: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    sanctumBearer:
      type: http
      scheme: bearer
      bearerFormat: Sanctum personal access token
      description: 'Obtain using register/login/OAuth response; send as Authorization: Bearer <token>.'
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    NotificationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: user
      in: path
      required: true
      schema: { type: integer }
    Hash:
      name: hash
      in: path
      required: true
      schema: { type: string }
    Token:
      name: token
      in: path
      required: true
      schema: { type: string }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: integer }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: integer }
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema: { type: integer }
    PackageId:
      name: packageId
      in: path
      required: true
      schema: { type: integer }
    AvailabilityId:
      name: availabilityId
      in: path
      required: true
      schema: { type: integer }
  responses:
    AuthenticationResult:
      description: Authentication succeeded and a Sanctum personal access token was issued.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthenticationResult' }
    OAuthCallbackResult:
      description: OAuth callback authenticated the user or completed identity linking.
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: '#/components/schemas/AuthenticationResult' }
              - { $ref: '#/components/schemas/MessageResult' }
    NotificationList:
      description: Paginated notifications belonging to the authenticated user.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/NotificationList' }
    NotificationReadResult:
      description: Notification marked as read.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/NotificationReadResult' }
    NotificationsReadAllResult:
      description: All unread notifications marked as read.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/NotificationsReadAllResult' }
    Success:
      description: Successful JSON response. See the endpoint description for the returned object shape.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiObject' }
    Created:
      description: Resource or payment attempt created successfully.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiObject' }
    ValidationError:
      description: Request validation failed (Laravel JSON validation response).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    Unauthorized:
      description: Missing/invalid bearer token or invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated user lacks the required role/permission, or a signature check failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Requested resource not found or not visible to the caller.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The request conflicts with the current resource state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: The request is valid JSON but cannot be completed in the current state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Named route rate limit exceeded.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: PayHere checkout or retrieval is not configured/available.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    ApiObject:
      type: object
      description: |
        Successful response object. Known top-level response members are typed below.
        Nested model/resource objects are intentionally extensible because exposed fields
        vary by endpoint and the application serializes several different Eloquent models.
      properties:
        message: { type: string }
        user: { $ref: '#/components/schemas/UserResponse' }
        token: { type: string }
        profile: { $ref: '#/components/schemas/CustomerProfileResponse' }
        booking: { $ref: '#/components/schemas/BookingResponse' }
        bookings:
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/BookingResponse' }
            - { $ref: '#/components/schemas/JsonObject' }
        review: { $ref: '#/components/schemas/JsonObject' }
        reviews:
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/JsonObject' }
            - { $ref: '#/components/schemas/JsonObject' }
        payment: { $ref: '#/components/schemas/PaymentResponse' }
        payments:
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/PaymentResponse' }
            - { $ref: '#/components/schemas/JsonObject' }
        checkout: { $ref: '#/components/schemas/JsonObject' }
        provider: { $ref: '#/components/schemas/AdminProviderResponse' }
        providers:
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/AdminProviderResponse' }
            - { $ref: '#/components/schemas/JsonObject' }
        service: { $ref: '#/components/schemas/AdminServiceResponse' }
        services:
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/AdminServiceResponse' }
            - { $ref: '#/components/schemas/JsonObject' }
        customer: { $ref: '#/components/schemas/AdminCustomerResponse' }
        customers:
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/AdminCustomerResponse' }
            - { $ref: '#/components/schemas/JsonObject' }
        category: { $ref: '#/components/schemas/AdminCategoryResponse' }
        categories:
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/AdminCategoryResponse' }
            - { $ref: '#/components/schemas/JsonObject' }
        package: { $ref: '#/components/schemas/JsonObject' }
        availability: { $ref: '#/components/schemas/JsonObject' }
        notifications:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        pagination: { $ref: '#/components/schemas/Pagination' }
        count: { type: integer }
        updated_count: { type: integer }
      additionalProperties: true
    AdminCustomerResponse:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        email_verified_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        bookings_count: { type: integer }
        reviews_count: { type: integer }
      additionalProperties: false
    AdminServiceResponse:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [draft, published, inactive] }
        is_featured: { type: boolean }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        packages_count: { type: integer }
        reviews_count: { type: integer }
        average_rating: { type: [number, 'null'] }
        provider: { $ref: '#/components/schemas/JsonObject' }
        category: { $ref: '#/components/schemas/JsonObject' }
      additionalProperties: true
    JsonObject:
      type: object
      description: Nested application model or resource object.
      additionalProperties: true
    UserResponse:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        email_verified_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        roles:
          type: array
          items: { $ref: '#/components/schemas/JsonObject' }
      additionalProperties: false
    CustomerProfileResponse:
      type: object
      properties:
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string }
        address: { type: string }
        city: { type: string }
        country: { type: string }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
      additionalProperties: false
    BookingResponse:
      type: object
      properties:
        id: { type: integer }
        booking_reference: { type: string }
        customer_id: { type: integer }
        service_provider_id: { type: integer }
        service_id: { type: integer }
        service_package_id: { type: integer }
        event_date: { type: string, format: date }
        start_time: { type: string }
        end_time: { type: string }
        event_location: { type: [string, 'null'] }
        customer_notes: { type: [string, 'null'] }
        provider_notes: { type: [string, 'null'] }
        cancellation_reason: { type: [string, 'null'] }
        total_amount: { type: string, pattern: '^[0-9]+(\.[0-9]{2})?$' }
        booking_status: { type: string, enum: [pending, accepted, rejected, confirmed, completed, cancelled] }
        payment_status: { type: string, enum: [pending, paid, unpaid] }
        accepted_at: { type: [string, 'null'], format: date-time }
        confirmed_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        cancelled_at: { type: [string, 'null'], format: date-time }
        customer: { $ref: '#/components/schemas/JsonObject' }
        provider: { $ref: '#/components/schemas/JsonObject' }
        service: { $ref: '#/components/schemas/JsonObject' }
        package: { $ref: '#/components/schemas/JsonObject' }
        payments:
          type: array
          items: { $ref: '#/components/schemas/JsonObject' }
        review: { $ref: '#/components/schemas/JsonObject' }
      additionalProperties: true
    PaymentResponse:
      type: object
      properties:
        id: { type: integer }
        payment_reference: { type: string }
        booking_id: { type: integer }
        customer_id: { type: integer }
