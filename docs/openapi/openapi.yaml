openapi: 3.1.0
info:
  title: Wedding Marketplace API
  version: 1.0.0
  description: |
    Authoritative contract for the Wedding Marketplace Laravel API.
    Paths include the `/api` prefix used by the application.
    Booking states observed in the implementation are pending, accepted, rejected,
    confirmed, completed and cancelled. Providers accept/reject pending bookings;
    customers may cancel pending/accepted bookings; successful payment for an accepted
    booking changes it to confirmed/paid; providers may complete confirmed bookings once
    the event date has arrived. A matching PayHere chargeback can mark a paid payment
    chargedback.
servers:
  - url: /
    description: Application origin
tags:
  - name: Authentication
  - name: Account security
  - name: Marketplace
  - name: Notifications
  - name: Customer
    description: All customer routes require a Sanctum bearer token and customer role. Owned booking/review/payment resources are scoped to the authenticated customer.
  - name: Provider
    description: Provider routes require a Sanctum bearer token and service_provider role. Service, availability, and booking mutations additionally enforce provider ownership and, where applicable, active/verified status.
  - name: Admin
    description: All admin routes require a Sanctum bearer token and admin role.
  - name: Payments
paths:
  /api/auth/google/redirect:
    get:
      operationId: redirectToGoogle
      tags: [Authentication]
      summary: Start Google sign-in
      description: Public browser-session OAuth redirect, limited to 10/minute per IP by default; redirects to Google.
      responses:
        '302':
          description: Redirect to Google authorization.
          headers:
            Location:
              schema: { type: string, format: uri }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/google/callback:
    get:
      operationId: googleCallback
      tags: [Authentication]
      summary: Complete Google sign-in or account linking
      description: |
        Public browser-session OAuth callback, limited to 10/minute per IP by default. A successful first sign-in
        creates a customer account; linking is selected by session state created by the
        authenticated `/api/auth/google/link` flow. OAuth provider query parameters are
        supplied by Google. The callback returns JSON; invalid/expired state is rejected.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/OAuthCallbackResult' }
        '201': { $ref: '#/components/responses/AuthenticationResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/google/link:
    get:
      operationId: linkGoogleAccount
      tags: [Authentication]
      summary: Start linking a Google identity
      description: Authenticated browser-session OAuth redirect, limited to 10/minute per IP by default.
      security:
        - sanctumBearer: []
      responses:
        '302':
          description: Redirect to Google authorization.
          headers:
            Location:
              schema: { type: string, format: uri }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/facebook/redirect:
    get:
      operationId: redirectToFacebook
      tags: [Authentication]
      summary: Start Facebook sign-in
      description: Public browser-session OAuth redirect, limited to 10/minute per IP by default; requests the email permission.
      responses:
        '302':
          description: Redirect to Facebook authorization.
          headers:
            Location:
              schema: { type: string, format: uri }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/facebook/callback:
    get:
      operationId: facebookCallback
      tags: [Authentication]
      summary: Complete Facebook sign-in or account linking
      description: |
        Public browser-session OAuth callback, limited to 10/minute per IP by default. New accounts receive the
        customer role. This flow does not treat Facebook email as verified. The callback
        returns JSON; OAuth provider query parameters are supplied by Facebook.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/OAuthCallbackResult' }
        '201': { $ref: '#/components/responses/AuthenticationResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/facebook/link:
    get:
      operationId: linkFacebookAccount
      tags: [Authentication]
      summary: Start linking a Facebook identity
      description: Authenticated browser-session OAuth redirect, limited to 10/minute per IP by default.
      security:
        - sanctumBearer: []
      responses:
        '302':
          description: Redirect to Facebook authorization.
          headers:
            Location:
              schema: { type: string, format: uri }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/forgot-password:
    post:
      operationId: requestPasswordResetLink
      tags: [Account security]
      summary: Request a password reset link
      description: Public; email existence is not disclosed. Default limit is 5 requests/minute per normalized email and IP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/reset-password:
    post:
      operationId: resetPasswordWithLink
      tags: [Account security]
      summary: Reset a password using a reset token
      description: Public legacy password-broker flow; successful reset revokes all Sanctum tokens. Default limit is 5 requests/minute per normalized email and IP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetLinkRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/reset-password/{token}:
    get:
      operationId: showPasswordResetTokenInstructions
      tags: [Account security]
      summary: Return password-reset submission instructions
      description: Public informational endpoint; it does not reset the password.
      parameters:
        - $ref: '#/components/parameters/Token'
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/auth/verify-email/{user}/{hash}:
    get:
      operationId: verifyEmail
      tags: [Account security]
      summary: Verify an email address
      description: Public signed-link endpoint. The signature and user email hash must be valid.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Hash'
        - { name: signature, in: query, required: true, schema: { type: string } }
        - { name: expires, in: query, schema: { type: integer }, description: Expiration timestamp included by the emailed temporary signed URL. }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/auth/register:
    post:
      operationId: register
      tags: [Authentication]
      summary: Register a customer or service provider
      description: Public; role is restricted to customer or service_provider. Rate-limited by IP (default 5/minute).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { $ref: '#/components/responses/AuthenticationResult' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/login:
    post:
      operationId: login
      tags: [Authentication]
      summary: Create a Sanctum bearer token
      description: Public; default limit 10/minute per normalized email and IP. Invalid credentials return 401.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/AuthenticationResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/password/change/otp/send:
    post:
      operationId: sendPasswordChangeOtp
      tags: [Account security]
      summary: Send an OTP for an authenticated password change
      description: |
        Requires a Sanctum token. Requires the current password. The OTP is purpose-isolated
        from reset OTPs, expires after 10 minutes, has a 60-second resend cooldown and at
        most 5 verification attempts. Send limit is 5/minute per user and IP.
      security:
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CurrentPasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/email/otp/send:
    post:
      operationId: sendRegistrationOtp
      tags: [Account security]
      summary: Send the authenticated user's email-verification OTP
      description: Requires Sanctum. Six digits; expires in 10 minutes; 60-second resend cooldown; five attempts; default limit 5/minute per user and IP.
      security:
        - sanctumBearer: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/email/otp/verify:
    post:
      operationId: verifyRegistrationOtp
      tags: [Account security]
      summary: Verify the authenticated user's email with an OTP
      description: Requires Sanctum. The six-digit code is purpose-isolated, expires after 10 minutes, and allows at most five attempts; default limit 10/minute per user and IP.
      security:
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpCodeRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/me:
    get:
      operationId: getCurrentUser
      tags: [Authentication]
      summary: Get the authenticated user
      security:
        - sanctumBearer: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      summary: Revoke the current Sanctum token
      security:
        - sanctumBearer: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/email/verification-notification:
    post:
      operationId: resendEmailVerification
      tags: [Account security]
      summary: Send a signed email-verification link if needed
      description: Requires Sanctum; default limit 6/minute per user.
      security:
        - sanctumBearer: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/password:
    put:
      operationId: changePassword
      tags: [Account security]
      summary: Change the authenticated user's password
      description: |
        Requires Sanctum and all four fields. The six-digit code must be an unexpired,
        unused password-change OTP, not a password-reset OTP. OTPs expire after 10 minutes,
        have a 60-second resend cooldown and five verification attempts. The current token
        remains valid; other tokens are revoked. Default limit 10/minute per user and IP.
      security:
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/password/otp/send:
    post:
      operationId: sendPasswordResetOtp
      tags: [Account security]
      summary: Send a public password-reset OTP
      description: |
        Public and does not disclose whether the email exists. This OTP is purpose-isolated
        from password-change and registration OTPs; it expires after 10 minutes, has a
        60-second resend cooldown and five verification attempts. Limit 5/minute per email and IP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/password/otp/reset:
    post:
      operationId: resetPasswordWithOtp
      tags: [Account security]
      summary: Reset a password using the public reset OTP
      description: Public; requires the email and password-reset-purpose OTP. A successful reset revokes all Sanctum tokens and invalidates remaining reset OTPs. Limit 10/minute per email and IP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetOtpRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/marketplace/categories:
    get:
      operationId: listMarketplaceCategories
      tags: [Marketplace]
      summary: List active marketplace categories
      description: Public; includes counts of published services and verified active providers.
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/marketplace/categories/{slug}:
    get:
      operationId: getMarketplaceCategory
      tags: [Marketplace]
      summary: Get an active category by slug
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/marketplace/providers:
    get:
      operationId: searchMarketplaceProviders
      tags: [Marketplace]
      summary: Search verified and active providers
      description: |
        Public filters: category slug, city, district, free-text search, sort
        (newest, oldest, name_asc, name_desc, rating_high, rating_low), and per_page
        (1-100). Results are paginated; default page size is 15.
      parameters:
        - { name: category, in: query, schema: { type: string, maxLength: 255 } }
        - { name: city, in: query, schema: { type: string, maxLength: 255 } }
        - { name: district, in: query, schema: { type: string, maxLength: 255 } }
        - { name: search, in: query, schema: { type: string, maxLength: 255 } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, oldest, name_asc, name_desc, rating_high, rating_low] } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/marketplace/providers/{slug}:
    get:
      operationId: getMarketplaceProvider
      tags: [Marketplace]
      summary: Get a public provider profile by slug
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/marketplace/services:
    get:
      operationId: searchMarketplaceServices
      tags: [Marketplace]
      summary: Search published services
      description: |
        Public filters: category, city, district, provider, search, sort
        (newest, oldest, name_asc, name_desc, rating_high, rating_low), featured,
        min_price, max_price, min_rating, and per_page (1-100; default 15).
        Results are restricted to verified, active providers. max_price cannot be
        lower than min_price when both are supplied.
      parameters:
        - { name: category, in: query, schema: { type: string, maxLength: 255 } }
        - { name: city, in: query, schema: { type: string, maxLength: 255 } }
        - { name: district, in: query, schema: { type: string, maxLength: 255 } }
        - { name: provider, in: query, schema: { type: string, maxLength: 255 } }
        - { name: search, in: query, schema: { type: string, maxLength: 255 } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, oldest, name_asc, name_desc, rating_high, rating_low] } }
        - { name: featured, in: query, schema: { type: boolean } }
        - { name: min_price, in: query, schema: { type: number, minimum: 0 } }
        - { name: max_price, in: query, schema: { type: number, minimum: 0 } }
        - { name: min_rating, in: query, schema: { type: number, minimum: 1, maximum: 5 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/marketplace/services/{slug}/reviews:
    get:
      operationId: listMarketplaceServiceReviews
      tags: [Marketplace]
      summary: List public reviews for a service
      parameters:
        - $ref: '#/components/parameters/Slug'
        - { name: rating, in: query, schema: { type: integer, minimum: 1, maximum: 5 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/marketplace/services/{slug}:
    get:
      operationId: getMarketplaceService
      tags: [Marketplace]
      summary: Get a public service by slug
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/payments/payhere/notify:
    post:
      operationId: receivePayHereNotification
      tags: [Payments]
      summary: Receive a PayHere server notification
      description: |
        Public gateway callback. The controller validates the required PayHere fields and
        verifies the MD5 signature using configured merchant credentials, then checks the
        trusted order, amount, currency, and gateway transaction identity. Payment/booking
        rows are locked during state changes; duplicate or stale notifications do not repeat
        transitions or payment-confirmed notifications. Never send merchant secrets here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayHereNotification' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/PayHereNotification' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/notifications:
    get:
      operationId: listNotifications
      tags: [Notifications]
      summary: List the authenticated user's notifications
      security:
        - sanctumBearer: []
      parameters:
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
      responses:
        '200': { $ref: '#/components/responses/NotificationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/notifications/unread:
    get:
      operationId: listUnreadNotifications
      tags: [Notifications]
      summary: List the authenticated user's unread notifications
      security:
        - sanctumBearer: []
      parameters:
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
      responses:
        '200': { $ref: '#/components/responses/NotificationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [Notifications]
      summary: Mark all of the authenticated user's unread notifications as read
      security:
        - sanctumBearer: []
      responses:
        '200': { $ref: '#/components/responses/NotificationsReadAllResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [Notifications]
      summary: Mark an owned notification as read
      description: Notification lookup is scoped to the authenticated user.
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200': { $ref: '#/components/responses/NotificationReadResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/customer/profile:
    get:
      operationId: getCustomerProfile
      tags: [Customer]
      summary: Get the authenticated customer's profile
      security:
        - sanctumBearer: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: saveCustomerProfile
      tags: [Customer]
      summary: Create or update the authenticated customer's profile
      security:
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerProfileRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/customer/bookings:
    get:
      operationId: listCustomerBookings
      tags: [Customer]
      summary: List the authenticated customer's bookings
      description: Results are scoped to the authenticated customer; this endpoint returns a collection, not a paginator.
      security:
        - sanctumBearer: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createCustomerBooking
      tags: [Customer]
      summary: Create a booking
      description: |
        Customer-only. The selected service must be published and its provider verified and
        active. A successful booking starts in pending state. Event date must be today or
        later, and end_time must follow start_time.
      security:
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookingRequest' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/customer/bookings/{id}:
    get:
      operationId: getCustomerBooking
      tags: [Customer]
      summary: Get an owned booking
      description: Booking lookup is scoped to the authenticated customer.
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/customer/bookings/{id}/cancel:
    post:
      operationId: cancelCustomerBooking
      tags: [Customer]
      summary: Cancel an owned booking
      description: Customer-only; only pending or accepted bookings can be cancelled. Active payment attempts are cancelled and payment status is set to unpaid.
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingCancellationRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
